<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Level 3 Sport - Unit 3 Synoptic Revision Guide</title>
  <style>
    :root {
      --primary: #003366;
      --primary-accent: #0056b3;
      --secondary: #f4f7f6;
      --text: #222222;
      --card-bg: #ffffff;
      --border: #dcdcdc;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #eef2f5;
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }

    .user-info-card {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      background: #ffffff;
      border-left: 5px solid var(--primary);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 200px;
    }

    .input-group label {
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #555;
    }

    .input-group input {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 1rem;
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-accent); }

    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #218838; }

    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }

    .btn-doc { background: #0f9d58; color: white; }
    .btn-doc:hover { background: #0b8043; }

    .save-status {
      font-size: 0.85rem;
      color: #666;
      font-style: italic;
    }

    .question-card {
      position: relative;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 8px;
    }

    .question-title {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .question-marks {
      background: #e9ecef;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #495057;
    }

    .question-text {
      margin-bottom: 15px;
      font-size: 1rem;
      white-space: pre-line;
    }

    .answer-box {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 8px;
    }

    .answer-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 5px rgba(0,51,102,0.2);
    }

    .list-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .list-item span {
      font-weight: bold;
      color: #666;
    }

    .list-item input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 0.95rem;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin: 10px 0;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .feedback-box {
      margin-top: 15px;
      padding: 12px 15px;
      border-radius: 6px;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.attempted {
      background-color: #f8f9fa;
      border-left: 4px solid var(--primary);
    }

    .feedback-box.unattempted {
      background-color: #fff3cd;
      border-left: 4px solid var(--warning);
      color: #856404;
    }

    .score-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      color: white;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .score-badge.high { background-color: var(--success); }
    .score-badge.med { background-color: var(--warning); color: #333; }
    .score-badge.low { background-color: var(--danger); }

    .model-answer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
      font-size: 0.9rem;
    }

    .model-answer h5 {
      color: var(--primary);
      margin-bottom: 4px;
    }

    .model-answer ul {
      margin-left: 20px;
    }

    .results-card {
      text-align: center;
      background: #ffffff;
      border: 2px solid var(--primary);
      display: none;
    }

    .results-card.show {
      display: block;
    }

    .total-score {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary);
      margin: 10px 0;
    }

    .hidden-file-input {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>OCR Level 3 Sport & Physical Activity</h1>
    <p>Unit 3 Synoptic Revision Guide - Interactive Worksheet</p>

  <div class="container">
    
    <!-- Student Info Card -->

    </div>

    <!-- Actions Bar -->
    <div class="actions-bar">

        <input type="file" id="importFileInput" class="hidden-file-input" accept=".json" onchange="importJSON(event)">
        <button class="btn-doc" onclick="exportGoogleDoc()">📄 Export as Google Doc</button>
      </div>
      <button class="btn-success" onclick="markAllQuestions()">✔ Mark My Work</button>

    </div>

    <!-- Questions Container -->

      <div class="card"><p>Loading questions...</p></div>
    </div>

  </div>

    // --- DOM Initialization & Render ---
    function renderQuestions() {

      if (!container) return;
      container.innerHTML = '';

      try {
        questionsData.forEach(q => {
          const card = document.createElement('div');
          card.className = 'card question-card';
          card.id = `card_${q.id}`;

          let inputHtml = '';

          if (q.type === 'list') {
            inputHtml = '<div class="list-inputs">';
            for (let i = 1; i <= q.count; i++) {
              inputHtml += `
                <div class="list-item">
                  <span>${i}.</span>
                  <input type="text" id="${q.id}_item_${i}" class="input-field" oninput="autoSave()">
                </div>
              `;
            }
            inputHtml += '</div>';
          } else if (q.type === 'single') {
            inputHtml = `<input type="text" id="${q.id}_single" class="answer-box input-field" style="min-height: auto;" oninput="autoSave()">`;
          } else if (q.type === 'stage_desc') {
            inputHtml = `
              <div class="list-inputs">
                <div class="list-item"><span>Stage 1 Name:</span><input type="text" id="${q.id}_s1_name" class="input-field" oninput="autoSave()"></div>
                <textarea id="${q.id}_s1_desc" class="answer-box input-field" placeholder="Description of Stage 1..." oninput="autoSave()"></textarea>
                <div class="list-item"><span>Stage 2 Name:</span><input type="text" id="${q.id}_s2_name" class="input-field" oninput="autoSave()"></div>

                <label class="radio-option"><input type="radio" name="${q.id}_tf" value="False" onchange="autoSave()"> False</label>

    // --- Fuzzy Matching & String Utility ---
    function levenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function normalizeText(text) {
      return text.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
    }

    function fuzzyMatchWord(inputWord, targetWord) {
      if (inputWord === targetWord) return true;
      if (targetWord.length <= 3) return inputWord === targetWord;
      const dist = levenshteinDistance(inputWord, targetWord);
      return dist <= (targetWord.length > 6 ? 2 : 1);
    }

    function matchesConceptGroup(inputText, keywordList) {
      const cleanInput = normalizeText(inputText);
      const inputWords = cleanInput.split(/\s+/);

      return keywordList.some(keyword => {
        const cleanKey = normalizeText(keyword);
        if (cleanInput.includes(cleanKey)) return true;

        const keyWords = cleanKey.split(/\s+/);
        return keyWords.every(kw => 
          inputWords.some(iw => fuzzyMatchWord(iw, kw))
        );
      });
    }

    // --- Marking Algorithm ---
    function markQuestion(q) {
      let score = 0;
      let attempted = false;
      let userAnswersText = [];

      if (q.type === 'list') {
        const usedGroups = new Set();
        for (let i = 1; i <= q.count; i++) {
          const el = document.getElementById(`${q.id}_item_${i}`);
          const val = el ? el.value.trim() : '';
          userAnswersText.push(val);
          if (val.length > 0) attempted = true;

          if (val.length > 2 && q.acceptable) {
            for (let gIdx = 0; gIdx < q.acceptable.length; gIdx++) {
              if (!usedGroups.has(gIdx)) {
                if (matchesConceptGroup(val, q.acceptable[gIdx])) {
                  score++;
                  usedGroups.add(gIdx);
                  break;
                }
              }
            }
          }
        }
      } else if (q.type === 'single') {
        const el = document.getElementById(`${q.id}_single`);
        const val = el ? el.value.trim() : '';
        userAnswersText.push(val);
        if (val.length > 0) attempted = true;

        if (val.length > 2 && q.acceptable) {
          for (let gIdx = 0; gIdx < q.acceptable.length; gIdx++) {
            if (matchesConceptGroup(val, q.acceptable[gIdx])) {
              score = 1;
              break;
            }
          }
        }
      } else if (q.type === 'stage_desc') {
        const s1_n = (document.getElementById(`${q.id}_s1_name`) || {}).value || '';
        const s1_d = (document.getElementById(`${q.id}_s1_desc`) || {}).value || '';
        const s2_n = (document.getElementById(`${q.id}_s2_name`) || {}).value || '';
        const s2_d = (document.getElementById(`${q.id}_s2_desc`) || {}).value || '';

        if (s1_n.trim() || s1_d.trim() || s2_n.trim() || s2_d.trim()) attempted = true;

        const stages = [
          { name: "storming", desc: ["compete", "role", "conflict", "tension", "power", "clique"] },
          { name: "norming", desc: ["agree", "common goal", "consensus", "role clearer", "unity"] },
          { name: "performing", desc: ["work together", "achieve goal", "autonomous", "resolve dispute"] },
          { name: "adjourning", desc: ["mourning", "disband", "separate", "celebrate"] }
        ];

        [ {n: s1_n, d: s1_d}, {n: s2_n, d: s2_d} ].forEach(pair => {
          if (pair.n.trim().length > 2) {
            stages.forEach(st => {
              if (matchesConceptGroup(pair.n, [st.name])) {
                score += 1;
                if (pair.d.trim().length > 5 && matchesConceptGroup(pair.d, st.desc)) {
                  score += 1;
                }
              }
            });
          }
        });
        score = Math.min(score, 4);
      } else if (q.type === 'tf') {
        const selected = document.querySelector(`input[name="${q.id}_tf"]:checked`);
        if (selected) {
          attempted = true;
          userAnswersText.push(selected.value);
          if (selected.value === q.correct) score = 1;
        }
      } else if (q.type === 'area') {
        const el = document.getElementById(`${q.id}_text`);
        const val = el ? el.value.trim() : '';
        userAnswersText.push(val);
        if (val.length > 0) attempted = true;

        if (val.length > 5 && q.acceptable) {
          const usedGroups = new Set();
          q.acceptable.forEach((group, idx) => {
            if (matchesConceptGroup(val, group) && !usedGroups.has(idx)) {
              score++;
              usedGroups.add(idx);
            }
          });
          score = Math.min(score, q.marks);
        }
      }

      return { score, attempted, userAnswersText };
    }

    function markAllQuestions() {
      let grandTotal = 0;
      let totalAttempted = 0;

      questionsData.forEach(q => {
        const result = markQuestion(q);
        const fbBox = document.getElementById(`feedback_${q.id}`);

        if (!result.attempted) {
          fbBox.className = "feedback-box show unattempted";
          fbBox.innerHTML = `
            <strong>⚠️ Not Attempted</strong>
            <p>You have not attempted this question. Complete your attempt to unlock the mark scheme and model answer.</p>
          `;
        } else {
          grandTotal += result.score;
          totalAttempted++;

          fbBox.className = "feedback-box show attempted";
          
          let badgeClass = "low";
          if (result.score === q.marks) badgeClass = "high";
          else if (result.score > 0) badgeClass = "med";

          let modelHtml = `<div class="model-answer"><h5>Model / Indicative Answers:</h5><ul>`;
          q.modelAnswers.forEach(m => {
            modelHtml += `<li>${m}</li>`;
          });
          modelHtml += `</ul></div>`;

          fbBox.innerHTML = `
            <span class="score-badge ${badgeClass}">Score: ${result.score} / ${q.marks}</span>
            <p style="font-size: 0.9rem; color: #444;">Feedback: Evaluated based on OCR mark scheme criteria and key physiological/sports development concepts.</p>
            ${modelHtml}
          `;
        }
      });

      const summaryCard = document.getElementById('resultsSummary');
      const scoreDisplay = document.getElementById('totalScoreDisplay');
      const feedbackDisplay = document.getElementById('gradeFeedback');

      scoreDisplay.innerText = `${grandTotal} / 66`;
      const percentage = Math.round((grandTotal / 66) * 100);

      let grade = "Keep Revising";
      if (percentage >= 80) grade = "Distinction* / Grade A*";
      else if (percentage >= 70) grade = "Distinction / Grade A";
      else if (percentage >= 60) grade = "Merit / Grade B";
      else if (percentage >= 50) grade = "Pass / Grade C";

      feedbackDisplay.innerHTML = `Overall Score: <strong>${percentage}%</strong> (${grade})<br><small>${totalAttempted} of ${questionsData.length} questions attempted.</small>`;
      summaryCard.className = "card results-card show";
      summaryCard.scrollIntoView({ behavior: 'smooth' });
    }

    // --- Save & Progress Management ---
    function collectFormData() {
      const data = {
        studentName: (document.getElementById('studentName') || {}).value || '',
        candidateNo: (document.getElementById('candidateNo') || {}).value || '',
        timestamp: new Date().toISOString(),
        answers: {}
      };

      questionsData.forEach(q => {
        if (q.type === 'list') {
          data.answers[q.id] = [];
          for (let i = 1; i <= q.count; i++) {
            const el = document.getElementById(`${q.id}_item_${i}`);
            data.answers[q.id].push(el ? el.value : '');
          }
        } else if (q.type === 'single') {
          const el = document.getElementById(`${q.id}_single`);
          data.answers[q.id] = el ? el.value : '';
        } else if (q.type === 'stage_desc') {
          data.answers[q.id] = {
            s1_name: (document.getElementById(`${q.id}_s1_name`) || {}).value || '',
            s1_desc: (document.getElementById(`${q.id}_s1_desc`) || {}).value || '',
            s2_name: (document.getElementById(`${q.id}_s2_name`) || {}).value || '',
            s2_desc: (document.getElementById(`${q.id}_s2_desc`) || {}).value || ''
          };
        } else if (q.type === 'tf') {
          const checked = document.querySelector(`input[name="${q.id}_tf"]:checked`);
          data.answers[q.id] = checked ? checked.value : "";
        } else if (q.type === 'area') {
          const el = document.getElementById(`${q.id}_text`);
          data.answers[q.id] = el ? el.value : '';
        }
      });

      return data;
    }

    function autoSave() {
      try {
        const data = collectFormData();
        localStorage.setItem('ocr_u3_revision_data', JSON.stringify(data));
        const status = document.getElementById('saveStatus');
        if (status) status.innerText = "Auto-saved at " + new Date().toLocaleTimeString();
      } catch (e) {
        console.warn("Auto-save skipped (localStorage blocked)");
      }
    }

    function saveToLocalStorage() {
      try {
        autoSave();
        alert("Your revision progress has been saved to your browser!");
      } catch (e) {
        alert("Unable to save to browser local storage. You can still use 'Export JSON' to save a file!");
      }
    }

    function loadFromLocalStorage() {
      try {
        const saved = localStorage.getItem('ocr_u3_revision_data');
        if (!saved) return;
        const data = JSON.parse(saved);
        if (data.studentName) document.getElementById('studentName').value = data.studentName;
        if (data.candidateNo) document.getElementById('candidateNo').value = data.candidateNo;

        if (data.answers) {
          questionsData.forEach(q => {
            const ans = data.answers[q.id];
            if (!ans) return;

            if (q.type === 'list' && Array.isArray(ans)) {
              ans.forEach((val, idx) => {
                const el = document.getElementById(`${q.id}_item_${idx + 1}`);
                if (el) el.value = val;
              });
            } else if (q.type === 'single') {
              const el = document.getElementById(`${q.id}_single`);
              if (el) el.value = ans;
            } else if (q.type === 'stage_desc' && typeof ans === 'object') {
              if (ans.s1_name && document.getElementById(`${q.id}_s1_name`)) document.getElementById(`${q.id}_s1_name`).value = ans.s1_name;
              if (ans.s1_desc && document.getElementById(`${q.id}_s1_desc`)) document.getElementById(`${q.id}_s1_desc`).value = ans.s1_desc;
              if (ans.s2_name && document.getElementById(`${q.id}_s2_name`)) document.getElementById(`${q.id}_s2_name`).value = ans.s2_name;
              if (ans.s2_desc && document.getElementById(`${q.id}_s2_desc`)) document.getElementById(`${q.id}_s2_desc`).value = ans.s2_desc;
            } else if (q.type === 'tf') {
              const rad = document.querySelector(`input[name="${q.id}_tf"][value="${ans}"]`);
              if (rad) rad.checked = true;
            } else if (q.type === 'area') {
              const el = document.getElementById(`${q.id}_text`);
              if (el) el.value = ans;
            }
          });
        }
      } catch (e) {
        console.error("Error loading saved data", e);
      }
    }

    function exportJSON() {
      const data = collectFormData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `OCR_Unit3_Revision_${(data.studentName || 'Student').replace(/\s+/g, '_')}.json`;
      a.click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          try { localStorage.setItem('ocr_u3_revision_data', JSON.stringify(data)); } catch(err){}
          loadFromLocalStorage();
          alert("Progress loaded successfully!");
        } catch (err) {
          alert("Invalid file format.");
        }
      };
      reader.readAsText(file);
    }

            <div class="q-title">${q.title} [${q.marks} Mark${q.marks > 1 ? 's' : ''}]</div>
            <div class="q-text">${q.text.replace(/\n/g, '<br>')}</div>
            <div class="user-ans">
              <strong>Student Answer:</strong><br>
        `;

        if (!markRes.attempted) {
          docHtml += `<em>[No attempt provided]</em></div>`;
          docHtml += `
            <div class="unattempted">
              <strong>Note:</strong> Question unattempted. Model answers are hidden until an attempt is completed.

          if (q.type === 'stage_desc') {

      const a = document.createElement('a');
      a.href = url;
      a.download = `Unit3_Revision_${name.replace(/\s+/g, '_')}.doc`;
      document.body.appendChild(a);
      a.click();

    // Direct Execution & DOMContentLoaded Trigger
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderQuestions);
    } else {
      renderQuestions();
    }
